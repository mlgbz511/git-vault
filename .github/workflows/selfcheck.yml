name: selfcheck

# Public-facing checks: unit tests, sanitized-export build, sensitive scan.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfcheck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Git identity for fixture repos
        shell: bash
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v > unit.log 2>&1 || {
            grep -E '^(FAIL|ERROR):' unit.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            tail -40 unit.log
            exit 1
          }
          tail -6 unit.log

      - name: Sanitized export + sensitive-pattern self-check
        shell: bash
        run: python scripts/export_public.py --out "$RUNNER_TEMP/public-export"

      - name: Single-file bundle smoke test
        shell: bash
        run: python scripts/package.py
