name: selfcheck

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  selfcheck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Git identity for fixture repos
        shell: bash
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"

      - name: Unit tests
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -s tests -v > unit.log 2>&1
          rc=$?
          tail -30 unit.log
          exit $rc

      - name: Report failure annotations
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          try:
              text = open("unit.log", encoding="utf-8", errors="replace").read()
          except OSError:
              text = "(no unit.log)"
          ann = []
          for line in text.splitlines():
              if re.match(r"^(FAIL|ERROR): ", line):
                  ann.append({"path": ".github/workflows/selfcheck.yml", "start_line": 1,
                              "end_line": 1, "annotation_level": "failure", "message": line[:900]})
          tail = "\n".join(text.splitlines()[-18:])
          if not ann:
              ann = [{"path": ".github/workflows/selfcheck.yml", "start_line": 1,
                      "end_line": 1, "annotation_level": "failure", "message": ("no FAIL/ERROR lines; tail: " + tail)[:900]}]
          body = json.dumps({"name": "selfcheck", "head_sha": sha, "status": "completed",
                             "conclusion": "failure", "output": {"title": "unit tests",
                             "summary": tail[:60000], "annotations": ann[:50]}}).encode()
          req = urllib.request.Request("https://api.github.com/repos/%s/check-runs" % repo, data=body,
                                       headers={"Authorization": "token " + token,
                                                "Accept": "application/vnd.github+json",
                                                "Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=30) as resp:
              print("annotation check-run", resp.status)
          PY

      - name: Sanitized export + sensitive-pattern self-check
        if: success()
        shell: bash
        run: python scripts/export_public.py --out "$RUNNER_TEMP/public-export"

      - name: Single-file bundle smoke test
        if: success()
        shell: bash
        run: python scripts/package.py
